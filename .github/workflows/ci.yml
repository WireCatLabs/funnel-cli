name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release publishes this job's build, so a packing run restores no cache another run could have written.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !inputs.pack }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "::error::not gofmt-formatted: $unformatted"; exit 1; }
      - run: node scripts/packages.mjs notices --check
      - run: node scripts/packages.mjs check
      - name: cross-build all six targets
        run: node scripts/packages.mjs build
      - name: launcher against the linux-x64 build
        env:
          WIRECAT_FUNNEL_TEST_BINARY: packages/funnel-linux-x64/bin/wirecat-funnel
        run: npm test
      - name: pack
        run: |
          mkdir dist
          npm pack --pack-destination dist
          for dir in packages/funnel-*; do npm pack "./$dir" --pack-destination dist; done
          [ "$(ls dist/*.tgz | wc -l)" -eq 7 ] || { echo "::error::expected seven packages"; exit 1; }
          (cd dist && sha256sum -- *.tgz > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.pack
        with:
          name: validated-packages
          path: dist/
          if-no-files-found: error
          retention-days: 7
